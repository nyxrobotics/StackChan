apiVersion: v1
kind: ConfigMap
metadata:
  name: template-single-configmap
data:
  config.yaml: |
    server:
      address:     ":12800"
      openapiPath: "/api.json"
      swaggerPath: "/swagger"

    logger:
      path: "./logs"
      file: "{Y-m-d}.log"
      level: "all"
      stdout: true
      rotateExpire: "7d"
      rotateBackup: 10
      rotateSize: "50M"

    database:
      default:
        link: ""

    jwt:
      secret: ""

    admin:
      users:
        - username: ""
          password: ""

    rsa:
      server:
        public:
        private:
      client:
        public:
        private:

    xiaozhi:
      secret_key:
      generate_license_token:
